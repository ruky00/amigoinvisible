# Perfil de desarrollo: H2 guardado en ./data (sobrevive a reinicios) y consola web.
# Consola: http://localhost:8080/h2-console  (JDBC URL la de abajo, usuario sa, sin contraseña)
spring:
  datasource:
    url: jdbc:h2:file:./data/amigoinvisible;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

app:
  demo-data: true
