# Configuración común. Los perfiles cambian solo la base de datos:
#   h2       (por defecto) -> H2 en fichero ./data, con consola en /h2-console
#   postgres               -> PostgreSQL (el de docker-compose.yml)
spring:
  application:
    name: amigo-invisible-api
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      # el esquema lo crea y versiona Flyway; Hibernate solo comprueba que encaja
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Contraseña de la zona de organización. En producción, SIEMPRE por variable de entorno.
  admin-password: ${ADMIN_PASSWORD:turron}
  # Cuánto dura una sesión (participantes vuelven durante semanas a mirar la lista)
  session-ttl: P90D
  # Intentos fallidos de login permitidos por IP en la ventana indicada
  login-rate-limit:
    max-failures: 10
    window: PT10M
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Carga los sorteos de ejemplo al arrancar si la base de datos está vacía
  demo-data: false
