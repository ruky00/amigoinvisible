# Tests: H2 en memoria. El nombre aleatorio da una base limpia a cada contexto de Spring.
spring:
  datasource:
    url: jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      enabled: false

app:
  admin-password: test-admin
  demo-data: false
  login-rate-limit:
    max-failures: 1000
    window: PT1M
